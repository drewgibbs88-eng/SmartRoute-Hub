{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto glass p-8 rounded-2xl shadow-2xl mt-10 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-900/50 border border-green-500 rounded-full mb-6">
        <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h2 class="text-2xl font-bold mb-2">Booking Confirmed</h2>
    <p class="text-gray-400 mb-6">Your deposit has been successfully processed.</p>
    
    <div class="bg-slate-900/50 p-6 rounded-xl border border-slate-700 text-left space-y-3">
        <p><span class="text-gray-400 text-sm uppercase">Service:</span> <br> {{ booking.service_name }}</p>
        <p><span class="text-gray-400 text-sm uppercase">Date:</span> <br> {{ booking.start_time.strftime('%d %b %Y at %H:%M') }}</p>
        <p><span class="text-gray-400 text-sm uppercase">Provider:</span> <br> {{ booking.owner.business_name }}</p>
    </div>
    
    <div class="mt-6">
        <a href="/" class="text-blue-400 hover:underline text-sm">Return Home</a>
    </div>
</div>
{% endblock %}
