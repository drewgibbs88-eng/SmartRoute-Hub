{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto glass p-8 rounded-2xl shadow-2xl mt-10">
    <h2 class="text-2xl font-bold mb-6 text-white">Create an Account</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs uppercase text-gray-400 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs uppercase text-gray-400 mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs uppercase text-gray-400 mb-1">Business Name</label>
            <input type="text" name="business_name" required class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-xs uppercase text-gray-400 mb-1">Dispatch Postcode</label>
            <input type="text" name="dispatch_postcode" required placeholder="e.g. SA1 18A" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition duration-200 mt-4">
            Sign Up
        </button>
    </form>
    <p class="mt-4 text-sm text-gray-400 text-center">Already have an account? <a href="/login" class="text-blue-400 hover:underline">Log in</a></p>
</div>
{% endblock %}
