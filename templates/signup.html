<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartRoute Hub - Business Signup</title>
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(17, 24, 39, 0.7); padding: 30px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #161d30; border: 1px solid #2d3748; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Business Signup</h2>
        <form action="/signup" method="POST">
            <input type="text" name="name" placeholder="Business Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 13px;"><a href="/login" style="color: #60a5fa;">Already have an account? Log in</a></p>
    </div>
</body>
</html>
